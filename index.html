<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تواصل معنا</title>
<style>
body{margin:0;background:#f0f2f5;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;width:90%;max-width:400px;padding:25px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.1);text-align:center}
textarea{width:100%;height:140px;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:17px;box-sizing:border-box}
.btn{background:#25D366;color:#fff;border:none;width:100%;padding:16px;border-radius:12px;font-size:19px;font-weight:bold;margin-top:15px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h3>ماهي مشكلتك؟ 🤔</h3>
<textarea id="msg" placeholder="اكتب مشكلتك هنا بالتفصيل..."></textarea>
<button class="btn" onclick="sendWA()">ارسال رسالة واتساب 📩</button>
</div>

<script>
function sendWA(){
let t = document.getElementById('msg').value;
if(t.length < 2){alert('اكتب مشكلتك اولاً');return}
let url = "https://wa.me/9647744606460?text=" + encodeURIComponent("ماهي مشكلتك: \n" + t);
window.open(url, "_blank");
}
</script>
</body>
</html>
