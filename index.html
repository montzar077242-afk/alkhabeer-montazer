<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استرجاع الحسابات</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 25px;
      max-width: 400px;
      width: 100%;
      border-right: 5px solid #25D366;
    }
    .card h2 {
      margin-top: 0;
      color: #333;
      font-size: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .info-group {
      margin-bottom: 12px;
      font-size: 15px;
      color: #555;
    }
    .info-group strong {
      color: #222;
    }
    .price {
      color: #d9534f;
      font-weight: bold;
    }
    .btn-whatsapp {
      display: block;
      width: 100%;
      background-color: #25D366;
      color: #fff;
      text-align: center;
      padding: 12px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      margin-top: 20px;
      transition: background 0.3s ease;
    }
    .btn-whatsapp:hover {
      background-color: #1ebd56;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>طلب انشاء ملف استرجاع</h2>
    
    <div class="info-group">
      <strong>يوزر الحساب:</strong> [أدخل اليوزر هنا]
    </div>
    
    <div class="info-group">
      <strong>الإيميل:</strong> [أدخل الإيميل هنا]
    </div>
    
    <div class="info-group">
      <strong>نوع التعطيل:</strong> [أدخل نوع التعطيل هنا]
    </div>
    
    <div class="info-group">
      <strong>المدة المتوقعة:</strong> من 1 يوم إلى 17 يوم
    </div>
    
    <div class="info-group">
      <strong>سعر الاسترجاع:</strong> <span class="price">38 ألف</span>
    </div>

    <!-- زر التواصل المباشر عبر الواتساب -->
    <a href="https://wa.me/9647724267708" class="btn-whatsapp" target="_blank">
      تواصل واتساب مباشر
    </a>
  </div>

</body>
</html>
