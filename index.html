<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الخبير منتظر - استرجاع الحسابات</title>
<style>
body{margin:0;background:#f0f2f5;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.box{background:#fff;width:100%;max-width:420px;padding:25px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.1);text-align:center;box-sizing:border-box}
h3{margin:0 0 15px;color:#111}
label{font-weight:bold;display:block;margin-bottom:6px;text-align:right;font-size:14px}
select,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box;background:#fff}
textarea{height:110px;margin-top:12px}
.file-box{margin-top:15px;background:#f9f9f9;padding:12px;border-radius:12px;border:1px dashed #aaa;text-align:center}
#preview{width:100%;max-height:200px;margin-top:10px;border-radius:10px;display:none;object-fit:cover}
.btn{background:#25D366;color:#fff;border:none;width:100%;padding:16px;border-radius:12px;font-size:18px;font-weight:bold;margin-top:18px;cursor:pointer}
.small{font-size:12px;color:#777;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<h3>ماهي مشكلتك؟ 👇</h3>

<label>اختر نوع المشكلة:</label>
<select id="type">

<option value="حسابك مخترق">2 - حسابك مخترق</option>
<option value="حسابك طاير نهائي">3 - حسابك طاير نهائي</option>
