<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استرجاع حسابات إنستغرام</title>
  <!-- مكتبة الأيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* خلفية هادئة وجذابة تدرج بين الأزرق السماوي الفاتح والبنفسجي الهادئ */
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
      padding: 30px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .insta-logo-container {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px auto;
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df5950 45%, #c62368 60%, #4f46e5 90%);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 15px rgba(220, 39, 67, 0.25);
    }
    .insta-logo-container i {
      font-size: 40px;
      color: #fff;
    }
    .card h2 {
      margin: 0 0 5px 0;
      color: #1c1e21;
      font-size: 22px;
      font-weight: 700;
    }
    .card p.subtitle {
      color: #65676b;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .notice-box {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: right;
    }
    .notice-box p {
      margin: 6px 0;
      font-size: 14px;
      color: #333;
    }
    .master-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #edf2f7;
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 6px;
    }
    .master-number {
      font-family: monospace;
      font-weight: bold;
      color: #007bff;
      letter-spacing: 1px;
      font-size: 15px;
    }
    .btn-copy {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-copy:hover {
      background-color: #0056b3;
    }
